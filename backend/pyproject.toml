[project]
name = "co-create-eval-backend"
version = "0.1.0"
description = "Backend foundation for the human-AI creativity assessment system"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlmodel==0.0.48",
  "alembic==1.20.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
